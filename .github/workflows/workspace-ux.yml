name: Blue Ocean 3D · UX regressions

on:
  push:
    branches: [fix/workspace-ux-p0-p1]
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'scripts/build-css.py'
      - '.github/workflows/workspace-ux.yml'

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check JavaScript syntax
        run: |
          node --check app/workspace-controls.mjs
          node --check app/environments-ui.mjs
          node --check app/floorplan-ui.mjs
      - name: Unit and contract tests
        run: npm test
      - name: Verify generated CSS bundle
        run: |
          python3 scripts/build-css.py
          git diff --exit-code -- app/styles-bundle.css
      - name: Install Chromium test runtime
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Browser workspace E2E
        run: python3 tests/workspace_browser.py
